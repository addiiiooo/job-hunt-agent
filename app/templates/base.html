<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Hunt Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="wrap">
    <a class="brand" href="/">Job&nbsp;Hunt&nbsp;Agent</a>
    <p class="tagline">Paste a job description. Get a grounded match report, a full trace, and bullets it refuses to invent.</p>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap">
    <p>Decision support, not an auto-applier. A human always presses send.</p>
  </footer>
</body>
</html>
