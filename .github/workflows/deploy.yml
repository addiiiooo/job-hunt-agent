name: deploy

# Builds in ACR and rolls out to Container Apps. Manual by default: an
# auto-deploy on every push to main is a good way to ship a broken demo during
# an interview.
on:
  workflow_dispatch:
    inputs:
      llm_client:
        description: "scripted (canned model output, no cost) or anthropic (live)"
        type: choice
        options: [scripted, anthropic]
        default: scripted
  push:
    branches: [main]
    paths: ["app/**", "Dockerfile", "requirements.txt"]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  RG: job-hunt-agent-rg
  APP: job-hunt-agent
  ENVIRONMENT: job-hunt-agent-env
  LOCATION: centralindia

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Requires a repo secret AZURE_CREDENTIALS holding the JSON from:
      #   az ad sp create-for-rbac --name job-hunt-agent-ci \
      #     --role contributor --scopes /subscriptions/<SUB_ID>/resourceGroups/job-hunt-agent-rg \
      #     --sdk-auth
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve registry
        id: acr
        run: echo "name=$(az acr list -g "$RG" --query '[0].name' -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Build image in ACR
        run: az acr build --registry "${{ steps.acr.outputs.name }}" --image "job-hunt-agent:${{ github.sha }}" .

      - name: Roll out
        run: |
          az containerapp update \
            --name "$APP" --resource-group "$RG" \
            --image "${{ steps.acr.outputs.name }}.azurecr.io/job-hunt-agent:${{ github.sha }}" \
            --set-env-vars "LLM_CLIENT=${{ inputs.llm_client || 'scripted' }}" \
                           LOG_LEVEL=INFO DB_PATH=/data/runs.db \
                           "ANTHROPIC_API_KEY=secretref:anthropic-api-key"

      - name: Verify /health
        run: |
          FQDN=$(az containerapp show -n "$APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 40); do
            if curl -sf "https://$FQDN/health" -o health.json; then break; fi
            sleep 3
          done
          cat health.json
          python -c "import json,sys; d=json.load(open('health.json')); sys.exit(0 if d['status']=='ok' else 1)"
          echo "Deployed: https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
