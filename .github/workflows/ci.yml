name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        # No ANTHROPIC_API_KEY is set, so the one live test skips itself and CI
        # stays free and deterministic. Everything else runs against the fake.
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t job-hunt-agent:ci .
      - name: Container serves /health
        run: |
          docker run -d --name jha -p 8000:8000 -e ANTHROPIC_API_KEY=ci-placeholder job-hunt-agent:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          python -c "import json;d=json.load(open('/tmp/health.json'));assert set(d['checks'])=={'sqlite','corpus','anthropic_api_key'},d;assert d['status']=='ok',d;print('health ok')"
          docker rm -f jha
