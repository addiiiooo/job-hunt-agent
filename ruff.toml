line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # long lines are caught by the formatter's judgement, not a hard stop
    "B008",  # FastAPI's Depends/Form defaults are the documented idiom
    "UP017", # datetime.UTC is 3.11+; timezone.utc keeps the suite runnable on 3.10
]

[lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
